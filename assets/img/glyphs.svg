  </symbol>
  <symbol id="grid" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5">
    <rect x="7" y="7" width="14" height="14"/>
    <rect x="27" y="7" width="14" height="14"/>
    <rect x="7" y="27" width="14" height="14"/>
    <rect x="27" y="27" width="14" height="14"/>
  </symbol>
  <symbol id="code" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M16 14L6 24l10 10M32 14l10 10-10 10M27 9l-6 30"/>
